name: CI/CD · El Cuache → Hostinger

# CI  (verificar): en cada push a cualquier rama y en cada Pull Request.
#      Revisa la sintaxis de todo el PHP, compila el sistema y arma la carpeta
#      de despliegue. Si algo falla, el PR muestra ❌ y no se despliega nada.
# CD  (desplegar): solo cuando cambia "main" (o a mano desde Actions) y si CI pasó.
#      Sube por SSH + rsync a public_html/restaurantelcuache
#      → https://restaurantelcuache.thonixdev.es
#
# Estructura en el servidor:
#   /            → Sitio público (Sitio/)
#   /sistema/    → Sistema administrador, carta y kiosco (Frontend/dist)
#   /Backend/    → API PHP
#
# rsync deja el servidor idéntico a la carpeta compilada (borra lo que ya no
# existe), PERO nunca toca: Backend/config/*.local.php (credenciales),
# Backend/uploads/f_* (fotos subidas) ni Backend/storage/documentos|asistencia
# (archivos privados del personal).
#
# Secreto del repositorio (Settings → Secrets and variables → Actions):
#   SSH_PRIVATE_KEY → contenido de la llave privada de despliegue (elcuache_deploy)
# Variables opcionales (pestaña Variables) si algún día cambia el servidor:
#   SSH_HOST (145.79.4.70) · SSH_PORT (65002) · SSH_USER (u622087758) · DEPLOY_PATH

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────── CI ───────────────────────────────
  verificar:
    name: 🧪 Verificar y compilar
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Obtener el código
        uses: actions/checkout@v4

      - name: 🐘 PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: 🛡️ Sin credenciales en el repositorio
        run: |
          # Las credenciales reales van SOLO en Backend/config/*.local.php del servidor.
          # database.php debe quedarse con los valores de XAMPP (root, sin contraseña).
          if grep -Eq "'password'[[:space:]]*=>[[:space:]]*'[^']+'" Backend/config/database.php \
             || grep -Eq "u[0-9]{9}_" Backend/config/database.php; then
            echo "::error file=Backend/config/database.php::Este archivo tiene credenciales reales. Muévelas a Backend/config/database.local.php (en el servidor) y deja aquí los valores de XAMPP."
            exit 1
          fi
          if git ls-files | grep -E '\.local\.php$|(^|/)\.env$'; then
            echo "::error::Hay archivos de credenciales versionados (ver lista de arriba). Quítalos con: git rm --cached <archivo>"
            exit 1
          fi
          echo "Sin credenciales en el repositorio"

      - name: 🔎 Sintaxis de todo el PHP
        run: |
          errores=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || errores=$((errores + 1))
          done < <(find Backend -name '*.php' -print0)
          [ "$errores" -eq 0 ] || { echo "::error::$errores archivo(s) PHP con errores"; exit 1; }
          echo "PHP: sin errores de sintaxis"

      - name: ⚙️ Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: 📦 Compilar el sistema
        working-directory: Frontend
        env:
          # En el servidor la app vive en /sistema y la API en /Backend
          VITE_API_URL: ../Backend/api/v1
        run: |
          npm ci
          npm run build

      - name: 📁 Armar la carpeta de despliegue
        run: |
          mkdir deploy
          # Sitio público en la raíz; sus enlaces apuntan a /sistema y /Backend
          cp -r Sitio/. deploy/
          sed -i 's#\.\./Frontend/dist/#sistema/#g; s#\.\./Backend/#Backend/#g' deploy/index.html deploy/js/main.js
          grep -q '\.\./Frontend\|\.\./Backend' deploy/index.html deploy/js/main.js && { echo "::error::Quedaron rutas locales en el sitio"; exit 1; }
          # Sistema compilado
          cp -r Frontend/dist deploy/sistema
          # API, sin archivos locales ni subidos
          cp -r Backend deploy/Backend
          rm -f deploy/Backend/config/*.local.php
          find deploy/Backend/uploads -type f ! -name '.htaccess' -delete
          rm -rf deploy/Backend/storage/documentos deploy/Backend/storage/asistencia
          rm -f deploy/README.md
          echo "Contenido a desplegar:" && du -sh deploy/* | sort -h

      - name: 📤 Guardar la carpeta para el despliegue
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: deploy
          path: deploy/
          include-hidden-files: true
          retention-days: 3

  # ─────────────────────────────── CD ───────────────────────────────
  desplegar:
    name: 🚀 Desplegar en Hostinger (SSH)
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://restaurantelcuache.thonixdev.es
    concurrency:
      group: deploy-hostinger
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ vars.SSH_HOST || '145.79.4.70' }}
      SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
      SSH_USER: ${{ vars.SSH_USER || 'u622087758' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/u622087758/domains/thonixdev.es/public_html/restaurantelcuache' }}
    steps:
      - name: 📥 Descargar la carpeta compilada
        uses: actions/download-artifact@v4
        with:
          name: deploy
          path: deploy/

      - name: 🔐 Preparar la llave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::Falta el secreto SSH_PRIVATE_KEY (Settings → Secrets and variables → Actions)"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Huella del servidor de Hostinger (evita conectarse a un impostor)
          cat >> ~/.ssh/known_hosts <<'KNOWN'
          [145.79.4.70]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFnGhWxjboDRRepP0qicN5/LVQRqXxVwDFb8PGcYWiDp
          [145.79.4.70]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBA+p18PwtmyqwbW6IwLuBbIzZb6eDCEAoUCd/VMmnJiKb+OertD4x47/nzSCcKUVPOUwwNRE1w4jev7Yr+KMXy8=
          KNOWN
          sed -i 's/^ *//' ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/deploy -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: 🔌 Probar la conexión
        run: $SSH "$SSH_USER@$SSH_HOST" 'echo "Conectado a $(hostname) · $(php -v | head -1)"'

      - name: 🚀 Sincronizar con rsync
        run: |
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete --itemize-changes \
            -e "$SSH" \
            --filter='P /Backend/config/*.local.php' \
            --filter='P /Backend/uploads/f_*' \
            --filter='P /Backend/storage/documentos/' \
            --filter='P /Backend/storage/asistencia/' \
            deploy/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/" | tail -n 40

      - name: 🛠️ Preparar carpetas en el servidor
        run: |
          $SSH "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_PATH' && \
            mkdir -p Backend/uploads Backend/storage/documentos Backend/storage/asistencia && \
            chmod 755 Backend/uploads Backend/storage/documentos Backend/storage/asistencia && \
            ( [ -f Backend/config/database.local.php ] && echo 'database.local.php: presente' || echo '::warning::Falta Backend/config/database.local.php en el servidor' )"

      - name: ✅ Comprobar que el sitio responde
        run: |
          sleep 3
          for url in "https://restaurantelcuache.thonixdev.es/" "https://restaurantelcuache.thonixdev.es/sistema/" "https://restaurantelcuache.thonixdev.es/Backend/api/v1/public/caja"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "$code  $url"
            [ "$code" = "200" ] || echo "::warning::$url respondió $code (revisa la base de datos y Backend/config/database.local.php en el servidor)"
          done
          # La CDN de Hostinger no debe servir un service worker viejo (la app no se actualizaría)
          base="https://restaurantelcuache.thonixdev.es/sistema/sw.js"
          if [ "$(curl -s --max-time 20 "$base" | md5sum)" != "$(curl -s --max-time 20 "$base?v=$GITHUB_RUN_ID" | md5sum)" ]; then
            echo "::warning::La CDN de Hostinger sirve un sw.js viejo. Purga la caché: hPanel → Sitios web → thonixdev.es → Rendimiento → CDN → Purgar toda la caché"
          else
            echo "sw.js al día en la CDN"
          fi
